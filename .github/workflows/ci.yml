name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  agentes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar que agents/ sale de roles/
        run: node scripts/generar.js --verificar

      - name: Probar el generador de agentes
        run: node --test scripts/test-generar.js

      - name: Probar las garantías de solo lectura y del worktree ciego
        run: node --test scripts/test-garantias.js

      - name: Probar el orquestador con una CLI falsa
        run: node --test scripts/test-orquestar.js

      - name: Probar el verificador de enlaces
        run: node --test scripts/test-verificar-enlaces.js

      - name: Probar el instalador multiplataforma
        run: node --test scripts/test-instalar.js

      - name: Verificar que no haya enlaces rotos en README y docs
        run: node scripts/verificar-enlaces.js

      - name: Validar frontmatter de los agentes
        run: node scripts/validar-agentes.js

      - name: Probar los hooks
        run: node --test scripts/test-hooks.js

      - name: Probar el verificador de contrato de proyecto
        run: node --test scripts/test-verificar-proyecto.js

      - name: Revisar los workflows
        run: node scripts/validar-workflows.js
